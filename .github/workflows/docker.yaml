# Build the Docker image and push it to Docker Hub (naturecons/wheretowork).
# Replaces the Docker Hub automated builds. Tags match the old build rules:
#   push to dev       -> dev
#   push to master    -> latest
#   git tag vX.Y.Z    -> release-X.Y.Z
# Manual runs on any other branch build the image without pushing it.
on:
  push:
    branches:
      - dev
      - master
    tags:
      - "v*"
  workflow_dispatch:

name: Docker

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    name: build and push

    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: naturecons/wheretowork
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}},prefix=release-

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.meta.outputs.tags != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
