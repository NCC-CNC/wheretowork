# Build the pkgdown website and deploy it to the gh-pages branch.
# GitHub Pages must be set to serve from the root of the gh-pages branch.
on:
  push: # trigger on push
    branches:
      - main
      - master
  workflow_dispatch: # trigger manually from the Actions tab

name: pkgdown

permissions:
  contents: write

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-22.04

    env:
      _R_REMOTES_NO_ERRORS_FROM_WARNINGS_: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get -y install libcurl4-openssl-dev coinor-libsymphony-dev coinor-libcbc-dev coinor-libclp-dev libudunits2-dev libgdal-dev libgeos-dev libproj-dev libharfbuzz-dev libfribidi-dev libuv1-dev libglpk-dev

      - name: Install dependencies
        run: |
          options(install.packages.compile.from.source = "never")
          install.packages(c("renv", "remotes"))
          renv::restore()
          # pkgdown is not in renv.lock, so install the current CRAN release
          remotes::install_cran("pkgdown")
        shell: Rscript {0}

      - name: Build site
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE, install = TRUE, run_dont_run = TRUE
          )
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
